name: Release

# HACS toont de naam van een GitHub-release; zonder releases valt het terug
# op de laatste commit en zie je een hash staan. Deze workflow maakt de
# release zodra je een tag pusht:
#
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag om een release voor te maken, bijvoorbeeld v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release aanmaken
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag, manifest, const en kaart noemen dezelfde versie
        # Anders installeert HACS "v0.2.0" terwijl Home Assistant 0.1.0
        # meldt, of draait de browser een kaart met een ander nummer.
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          uit_tag="${tag#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/time_to_leave/manifest.json'))['version'])")
          const=$(grep -oP '^VERSION = "\K[^"]+' custom_components/time_to_leave/const.py)
          kaart=$(grep -oP "const VERSIE = '\K[^']+" custom_components/time_to_leave/www/time-to-leave-card.js)
          echo "tag=$uit_tag manifest=$manifest const=$const kaart=$kaart"
          for v in "$manifest" "$const" "$kaart"; do
            if [ "$v" != "$uit_tag" ]; then
              echo "::error::tag $tag hoort bij $uit_tag, maar manifest/const/kaart zeggen $manifest/$const/$kaart"
              exit 1
            fi
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tests
        run: |
          python -m pip install --quiet pytest voluptuous
          python -m pytest tests -q
          node --test tests/kaart.test.mjs
          npm install --no-save --silent acorn@8
          node tests/floor.mjs custom_components/time_to_leave/www/time-to-leave-card.js

      - name: Release publiceren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$tag" --title "$tag" --target "${{ github.sha }}" --generate-notes
